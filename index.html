<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live 3D Plotter Printer - Joyas Jack</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #12161f; /* Fondo de estudio / OBS */
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Pantalla de Activación por Key / Licencia */
        #auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 19, 23, 0.98);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .auth-box {
            background: #1e272e;
            padding: 30px;
            border-radius: 12px;
            border: 2px solid #485460;
            text-align: center;
            width: 350px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.7);
            color: #fff;
        }
        .auth-box h2 { margin-bottom: 15px; color: #f1c40f; }
        .auth-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #111;
            border: 1px solid #485460;
            color: #fff;
            border-radius: 6px;
            text-align: center;
            font-size: 16px;
        }
        .auth-box button {
            width: 100%;
            padding: 12px;
            background: #e74c3c;
            border: none;
            color: #fff;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .error-msg { color: #ff6b6b; font-size: 13px; margin-top: 10px; display: none; }

        /* Panel de Control flotante para simular los 3 regalos */
        #control-panel {
            display: none;
            position: fixed;
            top: 20px; right: 20px;
            background: rgba(30, 39, 46, 0.95);
            border: 2px solid #f1c40f;
            padding: 15px;
            border-radius: 10px;
            z-index: 2000;
            color: #fff;
            width: 280px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }
        .gift-btn {
            width: 100%;
            padding: 8px;
            margin-top: 6px;
            border: none;
            color: #fff;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-rose { background: #e74c3c; }
        .btn-5c { background: #3498db; }
        .btn-30c { background: #9b59b6; }

        /* --- MÁQUINA 3D PLOTTER / GRABADORA (DIÉSEÑO EXACTO DE LA FOTO) --- */
        .plotter-scene {
            position: relative;
            width: 520px;
            height: 650px;
            display: flex;
            flex-direction: column;
            align-items: center;
            perspective: 1200px;
        }

        /* Mesa de fondo simulada */
        .wooden-table-bg {
            position: absolute;
            top: 0; left: -50px; right: -50px; bottom: 0;
            background: radial-gradient(circle, #3d2817 0%, #1a100a 100%);
            z-index: 1;
            border-radius: 15px;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
        }

        /* Rollo de papel pergamino continuo debajo de la máquina */
        .continuous-paper-roll {
            position: absolute;
            top: 90px;
            width: 400px;
            height: 520px;
            background: #f4edd3; /* Tono pergamino idéntico a la foto */
            border-left: 4px solid #c8b99c;
            border-right: 4px solid #c8b99c;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            padding-top: 20px;
        }

        /* Estructura física 3D de la máquina (Rieles laterales y Puente superior) */
        .machine-rails-assembly {
            position: absolute;
            top: 30px;
            width: 460px;
            height: 120px;
            z-index: 20;
            pointer-events: none;
        }

        /* Riel metálico izquierdo */
        .rail-left, .rail-right {
            position: absolute;
            top: 0;
            width: 22px;
            height: 130px;
            background: linear-gradient(90deg, #7f8c8d, #ecf0f1, #7f8c8d);
            border-radius: 4px;
            border: 1px solid #2c3e50;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .rail-left { left: 0; }
        .rail-right { right: 0; }

        /* Puente transversal metálico móvil con efecto grabado láser */
        .gantry-bridge {
            position: absolute;
            top: 15px;
            left: 10px;
            right: 10px;
            height: 45px;
            background: linear-gradient(180deg, #34495e, #1a252f);
            border-radius: 6px;
            border: 2px solid #7f8c8d;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Cabezal de grabado láser central que se desliza dibujando */
        .laser-carriage {
            position: absolute;
            width: 75px;
            height: 55px;
            background: linear-gradient(180deg, #e74c3c, #c0392b);
            border-radius: 4px;
            border: 2px solid #fff;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.9);
            top: -5px;
            animation: carveLaser 3s ease-in-out infinite alternate;
        }

        /* Haz de luz láser apuntando al papel */
        .laser-carriage::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 31px;
            width: 10px;
            height: 15px;
            background: #00ffff;
            box-shadow: 0 0 15px #00ffff, 0 0 25px #ff00ff;
            border-radius: 50%;
        }

        @keyframes carveLaser {
            0% { transform: translateX(-150px); }
            100% { transform: translateX(150px); }
        }

        /* Tarjeta / Recuadro impreso en el papel (estilo técnico de la foto) */
        .drawn-ticket-card {
            width: 330px;
            background: #ffffff;
            border: 3px solid #2c3e50;
            border-radius: 4px;
            padding: 14px;
            margin-bottom: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 10;
            animation: dropTicket 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes dropTicket {
            0% {
                transform: translateY(-80px) scale(0.9);
                opacity: 0;
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .avatar-frame-box {
            width: 90px;
            height: 90px;
            border: 3px solid #2c3e50;
            border-radius: 50%;
            overflow: hidden;
            background: #ddd;
            margin-bottom: 8px;
        }

        .avatar-frame-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-name-label {
            font-size: 16px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 4px;
            text-align: center;
        }

        .gift-info-badge {
            font-size: 12px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 10px;
        }
        .badge-rose { background: #fadbd8; color: #c0392b; }
        .badge-5c { background: #ebf5fb; color: #2980b9; }
        .badge-30c { background: #f4ecf7; color: #8e44ad; }
    </style>
</head>
<body>

    <!-- Pantalla de Activación por Key / Licencia -->
    <div id="auth-overlay">
        <div class="auth-box">
            <h2>🔑 Activar Sistema 3D</h2>
            <p style="font-size: 12px; color: #a0aec0; margin-bottom: 15px;">Ingresa tu Key o Admin Key</p>
            <input type="text" id="license-input" placeholder="Ingresa tu Clave">
            <button onclick="verificarLicencia()">Activar</button>
            <div id="error-msg" class="error-msg">Clave incorrecta o no válida para este PC.</div>
        </div>
    </div>

    <!-- Panel de Control con los 3 Regalos -->
    <div id="control-panel">
        <h3 style="margin-top:0; color:#f1c40f; font-size:15px;">⚙️ Simular Regalos (Live)</h3>
        <p style="font-size: 10px; margin-bottom:5px; word-break: break-all;">HWID: <span id="current-hwid" style="color: #f1c40f;"></span></p>
        
        <button class="gift-btn btn-rose" onclick="simularRegalo('Rosa', '1 Coin', 'badge-rose', 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150')">🌹 Enviar Rosa (1 Coin)</button>
        <button class="gift-btn btn-5c" onclick="simularRegalo('Donut', '5 Coins', 'badge-5c', 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150')">🍩 Regalo 5 Coins</button>
        <button class="gift-btn btn-30c" onclick="simularRegalo('Perfume', '30 Coins', 'badge-30c', 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150')">💎 Regalo 30 Coins</button>
        
        <button class="gift-btn" style="background:#2980b9; margin-top:12px;" onclick="generarKey()">🔑 Crear Key Cliente</button>
    </div>

    <!-- Escenario Visual 3D Exacto al de la Foto -->
    <div class="plotter-scene">
        <div class="wooden-table-bg"></div>

        <!-- Máquina Plotter con rieles y cabezal láser -->
        <div class="machine-rails-assembly">
            <div class="rail-left"></div>
            <div class="rail-right"></div>
            <div class="gantry-bridge">
                <div class="laser-carriage"></div>
            </div>
        </div>

        <!-- Rollo de papel continuo pergamino -->
        <div class="continuous-paper-roll" id="cards-container">
            <!-- Los perfiles impresos aparecerán aquí ordenadamente -->
        </div>
    </div>

    <script>
        let pcHwid = localStorage.getItem('device_hwid');
        if (!pcHwid) {
            pcHwid = 'HWID-' + Math.random().toString(36).substring(2, 9).toUpperCase();
            localStorage.setItem('device_hwid', pcHwid);
        }
        document.getElementById('current-hwid').innerText = pcHwid;

        window.onload = function() {
            let saved = localStorage.getItem('app_activated_key');
            if (saved) {
                document.getElementById('auth-overlay').style.display = 'none';
                if (saved === 'Carolinaymiguel') {
                    document.getElementById('control-panel').style.display = 'block';
                }
                iniciarModoLive();
            }
        };

        function verificarLicencia() {
            let val = document.getElementById('license-input').value.trim();
            if (val === 'Carolinaymiguel') {
                localStorage.setItem('app_activated_key', 'Carolinaymiguel');
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('control-panel').style.display = 'block';
                iniciarModoLive();
                return;
            }

            let keys = JSON.parse(localStorage.getItem('jj_keys') || '{}');
            if (keys[val] === pcHwid) {
                localStorage.setItem('app_activated_key', val);
                document.getElementById('auth-overlay').style.display = 'none';
                iniciarModoLive();
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        function generarKey() {
            let targetHwid = prompt("Ingresa el HWID del PC del cliente:");
            if (!targetHwid) return;
            let newKey = 'JJ-' + Math.random().toString(36).substring(2, 8).toUpperCase();
            let keys = JSON.parse(localStorage.getItem('jj_keys') || '{}');
            keys[newKey] = targetHwid.trim();
            localStorage.setItem('jj_keys', JSON.stringify(keys));
            alert("Key generada con éxito:\n\n" + newKey);
        }

        // Función que graba y dibuja el perfil en el papel al recibir un regalo
        function imprimirPerfilEnPapel(username, giftName, badgeClass, avatarUrl) {
            const container = document.getElementById('cards-container');
            const card = document.createElement('div');
            card.className = 'drawn-ticket-card';
            
            card.innerHTML = `
                <div class="avatar-frame-box">
                    <img src="${avatarUrl}" alt="Avatar">
                </div>
                <div class="user-name-label">@${username}</div>
                <div class="gift-info-badge ${badgeClass}">🎁 ${giftName}</div>
            `;

            container.insertBefore(card, container.firstChild);

            if (container.children.length > 3) {
                container.removeChild(container.lastChild);
            }
        }

        function simularRegalo(giftName, cost, badgeClass, avatar) {
            const nombres = ["ClienteVip_925", "JoyasJack_Fan", "ColeccionistaChile", "CompradorEstelar", "Mariana_Silver"];
            let randomUser = nombres[Math.floor(Math.random() * nombres.length)];
            imprimirPerfilEnPapel(randomUser, `${giftName} (${cost})`, badgeClass, avatar);
        }

        function iniciarModoLive() {
            console.log("Sistema 3D Plotter listo. Esperando eventos de TikTok LIVE.");
        }
    </script>
</body>
</html>
