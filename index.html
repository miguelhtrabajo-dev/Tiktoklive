<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live Laser Plotter - Joyas Jack</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: transparent;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Pantalla de Activación por Key / HWID */
        #auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(11, 14, 20, 0.98);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        .auth-box {
            background: #1e272e;
            padding: 30px;
            border-radius: 12px;
            border: 2px solid #485460;
            text-align: center;
            width: 350px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.8);
            color: #fff;
        }
        .auth-box h2 { margin-bottom: 15px; color: #f1c40f; }
        .auth-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #111;
            border: 1px solid #485460;
            color: #fff;
            border-radius: 6px;
            text-align: center;
            font-size: 16px;
        }
        .auth-box button {
            width: 100%;
            padding: 12px;
            background: #e74c3c;
            border: none;
            color: #fff;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .error-msg { color: #ff6b6b; font-size: 13px; margin-top: 10px; display: none; }

        /* Panel de Control para Simular Regalos en Directo */
        #control-panel {
            display: none;
            position: fixed;
            top: 20px; right: 20px;
            background: rgba(30, 39, 46, 0.95);
            border: 2px solid #f1c40f;
            padding: 15px;
            border-radius: 10px;
            z-index: 5000;
            color: #fff;
            width: 270px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
        }
        .gift-btn {
            width: 100%;
            padding: 8px;
            margin-top: 6px;
            border: none;
            color: #fff;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-rose { background: #e74c3c; }
        .btn-5c { background: #3498db; }
        .btn-30c { background: #9b59b6; }

        /* --- ESCENARIO 3D INDUSTRIAL (MESA, PAPEL Y PÓRTICO) --- */
        .scene-container {
            position: relative;
            width: 480px;
            height: 720px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .wood-surface {
            position: absolute;
            top: 0; left: -100px; right: -100px; bottom: 0;
            background: linear-gradient(145deg, #2b1608 0%, #100703 100%);
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
            z-index: 1;
        }

        /* Rollo de papel pergamino continuo con Canvas de Grabado Láser */
        .parchment-paper-roll {
            position: absolute;
            top: 35px;
            width: 390px;
            height: 640px;
            background: #f5eedc;
            border-left: 6px solid #d4c5a9;
            border-right: 6px solid #d4c5a9;
            box-shadow: 0 30px 60px rgba(0,0,0,0.85);
            z-index: 10;
            overflow: hidden;
        }

        #laser-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 15;
        }

        /* Estructura del Pórtico Metálico Fijo */
        .plotter-gantry-frame {
            position: absolute;
            top: 10px;
            width: 450px;
            height: 140px;
            z-index: 100;
            pointer-events: none;
        }

        .rail-left, .rail-right {
            position: absolute;
            top: 0;
            width: 26px;
            height: 140px;
            background: linear-gradient(90deg, #7f8c8d, #ecf0f1, #7f8c8d);
            border-radius: 4px;
            border: 2px solid #1a252f;
            box-shadow: 0 8px 20px rgba(0,0,0,0.7);
        }
        .rail-left { left: 0; }
        .rail-right { right: 0; }

        .gantry-bridge-bar {
            position: absolute;
            top: 25px;
            left: 12px;
            right: 12px;
            height: 38px;
            background: linear-gradient(180deg, #34495e, #1a252f);
            border-radius: 6px;
            border: 2px solid #7f8c8d;
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Cabezal Láser Físico Animado en el puente */
        .laser-block {
            position: absolute;
            width: 65px;
            height: 44px;
            background: linear-gradient(180deg, #e74c3c, #900c3f);
            border-radius: 4px;
            border: 2px solid #fff;
            box-shadow: 0 0 25px rgba(231, 76, 60, 0.9);
            top: -3px;
            transition: transform 0.1s linear;
        }

        .laser-block::after {
            content: '';
            position: absolute;
            bottom: -14px;
            left: 26px;
            width: 12px;
            height: 12px;
            background: #ff0055;
            box-shadow: 0 0 15px #ff0055, 0 0 30px #00ffff;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Activación por Key / HWID -->
    <div id="auth-overlay">
        <div class="auth-box">
            <h2>🔑 Activar Sistema Laser 3D</h2>
            <p style="font-size: 12px; color: #a0aec0; margin-bottom: 15px;">Ingresa tu Key vitalicia o Admin Key</p>
            <input type="text" id="license-input" placeholder="Ingresa tu Clave">
            <button onclick="verificarLicencia()">Activar</button>
            <div id="error-msg" class="error-msg">Clave incorrecta o no válida para este PC.</div>
        </div>
    </div>

    <!-- Panel de Control para Simular Regalos en Directo -->
    <div id="control-panel">
        <h3 style="margin-top:0; color:#f1c40f; font-size:15px;">⚙️ Panel de Simulación Live</h3>
        <p style="font-size: 10px; margin-bottom:5px; word-break: break-all;">HWID: <span id="current-hwid" style="color: #f1c40f;"></span></p>
        
        <button class="gift-btn btn-rose" onclick="activarRegalo('Rosa', '1 Coin', '#c0392b', 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150')">🌹 Enviar Rosa (1 Coin)</button>
        <button class="gift-btn btn-5c" onclick="activarRegalo('Regalo 5 Coins', '5 Coins', '#2980b9', 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150')">🍩 Regalo 5 Coins</button>
        <button class="gift-btn btn-30c" onclick="activarRegalo('Regalo 30 Coins', '30 Coins', '#8e44ad', 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150')">💎 Regalo 30 Coins</button>
        
        <button class="gift-btn" style="background:#2980b9; margin-top:12px;" onclick="generarKey()">🔑 Crear Key Cliente</button>
    </div>

    <!-- Escenario 3D con Canvas de Grabado Láser Real -->
    <div class="scene-container">
        <div class="wood-surface"></div>

        <!-- Sistema de Pórtico -->
        <div class="plotter-gantry-frame">
            <div class="rail-left"></div>
            <div class="rail-right"></div>
            <div class="gantry-bridge-bar">
                <div class="laser-block" id="laser-head"></div>
            </div>
        </div>

        <!-- Rollo de Papel y Canvas de Grabado -->
        <div class="parchment-paper-roll">
            <canvas id="laser-canvas" width="390" height="640"></canvas>
        </div>
    </div>

    <script>
        let pcHwid = localStorage.getItem('device_hwid');
        if (!pcHwid) {
            pcHwid = 'HWID-' + Math.random().toString(36).substring(2, 9).toUpperCase();
            localStorage.setItem('device_hwid', pcHwid);
        }
        document.getElementById('current-hwid').innerText = pcHwid;

        window.onload = function() {
            let saved = localStorage.getItem('app_activated_key');
            if (saved) {
                document.getElementById('auth-overlay').style.display = 'none';
                if (saved === 'Carolinaymiguel') {
                    document.getElementById('control-panel').style.display = 'block';
                }
            }
        };

        function verificarLicencia() {
            let val = document.getElementById('license-input').value.trim();
            if (val === 'Carolinaymiguel') {
                localStorage.setItem('app_activated_key', 'Carolinaymiguel');
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('control-panel').style.display = 'block';
                return;
            }

            let keys = JSON.parse(localStorage.getItem('jj_keys') || '{}');
            if (keys[val] === pcHwid) {
                localStorage.setItem('app_activated_key', val);
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('control-panel').style.display = 'block';
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        function generarKey() {
            let targetHwid = prompt("Ingresa el HWID del PC del cliente:");
            if (!targetHwid) return;
            let newKey = 'JJ-' + Math.random().toString(36).substring(2, 8).toUpperCase();
            let keys = JSON.parse(localStorage.getItem('jj_keys') || '{}');
            keys[newKey] = targetHwid.trim();
            localStorage.setItem('jj_keys', JSON.stringify(keys));
            alert("Key generada con éxito:\n\n" + newKey);
        }

        // --- MOTOR DE GRABADO LÁSER EN CANVAS (Trazado real línea por línea) ---
        const canvas = document.getElementById('laser-canvas');
        const ctx = canvas.getContext('2d');
        const laserHead = document.getElementById('laser-head');

        let listaTarjetas = [];
        let estadoGrabado = null; // Objeto que se está dibujando actualmente con láser

        function rediseñarEscenario() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Dibujar tarjetas ya impresas y fijas en el papel
            listaTarjetas.forEach(t => {
                dibujarTarjetaCompleta(t.x, t.y, t);
            });

            // 2. Si hay una tarjeta grabándose por láser en este momento
            if (estadoGrabado) {
                dibujarTarjetaProgreso(estadoGrabado);
            }
        }

        function dibujarTarjetaCompleta(x, y, t) {
            ctx.save();
            ctx.translate(x, y);

            // Cuadro negro estilo polaroid
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, 320, 150);
            ctx.strokeStyle = "#111111";
            ctx.lineWidth = 4;
            ctx.strokeRect(0, 0, 320, 150);

            // Avatar circular
            ctx.save();
            ctx.beginPath();
            ctx.arc(60, 75, 35, 0, Math.PI * 2, true);
            ctx.closePath();
            ctx.clip();
            if (t.imgLoaded && t.imgObj) {
                ctx.drawImage(t.imgObj, 25, 40, 70, 70);
            } else {
                ctx.fillStyle = "#ccc";
                ctx.fillRect(25, 40, 70, 70);
            }
            ctx.restore();

            ctx.beginPath();
            ctx.arc(60, 75, 35, 0, Math.PI * 2, true);
            ctx.strokeStyle = "#111111";
            ctx.lineWidth = 3;
            ctx.stroke();

            // Nombre y Regalo
            ctx.fillStyle = "#111111";
            ctx.font = "bold 16px 'Segoe UI', Arial";
            ctx.fillText("@" + t.username, 115, 65);

            ctx.fillStyle = t.badgeColor;
            ctx.fillRect(115, 80, 180, 28);
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 12px 'Segoe UI', Arial";
            ctx.fillText("🎁 " + t.giftText, 125, 98);

            ctx.restore();
        }

        function dibujarTarjetaProgreso(g) {
            ctx.save();
            ctx.translate(g.x, g.y);

            // El láser quema progresivamente el cuadro según el porcentaje de progreso (0 a 1)
            let prog = g.progress;

            // Marco exterior
            if (prog > 0.05) {
                ctx.strokeStyle = "#111111";
                ctx.lineWidth = 4;
                ctx.strokeRect(0, 0, 320, 150);
            }

            // Avatar quemándose
            if (prog > 0.3) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(60, 75, 35, 0, Math.PI * 2, true);
                ctx.closePath();
                ctx.clip();
                if (g.imgLoaded && g.imgObj) {
                    ctx.drawImage(g.imgObj, 25, 40, 70, 70);
                }
                ctx.restore();

                ctx.beginPath();
                ctx.arc(60, 75, 35, 0, Math.PI * 2, true);
                ctx.strokeStyle = "#111111";
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            // Texto quemado por el láser
            if (prog > 0.6) {
                ctx.fillStyle = "#111111";
                ctx.font = "bold 16px 'Segoe UI', Arial";
                ctx.fillText("@" + g.username, 115, 65);
            }

            if (prog > 0.8) {
                ctx.fillStyle = g.badgeColor;
                ctx.fillRect(115, 80, 180, 28);
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 12px 'Segoe UI', Arial";
                ctx.fillText("🎁 " + g.giftText, 125, 98);
            }

            ctx.restore();
        }

        // Función que activa el grabado láser al recibir un regalo (botones o en vivo)
        function activarRegalo(giftName, cost, badgeColor, avatarUrl) {
            if (estadoGrabado) return; // Esperar a que termine el grabado actual

            const nombres = ["ClienteVip_925", "JoyasJack_Fan", "ColeccionistaChile", "CompradorEstelar", "Mariana_Silver", "Dini_Live"];
            let randomUser = nombres[Math.floor(Math.random() * nombres.length)];

            let img = new Image();
            img.crossOrigin = "anonymous";
            img.src = avatarUrl;

            img.onload = function() {
                // Desplazar tarjetas existentes hacia abajo para hacer espacio en el rollo de papel
                listaTarjetas.forEach(t => {
                    t.targetY += 170;
                });

                estadoGrabado = {
                    username: randomUser,
                    giftText: `${giftName} (${cost})`,
                    badgeColor: badgeColor,
                    imgObj: img,
                    imgLoaded: true,
                    x: 35,
                    y: 20, // Posición fija donde el láser graba arriba
                    targetY: 20,
                    progress: 0
                };

                // Animar el cabezal láser físico moviéndose de lado a lado mientras quema
                let startTime = Date.now();
                let duration = 1500; // 1.5 segundos de grabado láser real

                function bucleLaser() {
                    let elapsed = Date.now() - startTime;
                    let p = elapsed / duration;
                    if (p > 1) p = 1;

                    estadoGrabado.progress = p;

                    // Mover el cabezal láser metálico superior sincronizado con el dibujo
                    let laserX = Math.sin(p * Math.PI * 4) * 120;
                    laserHead.style.transform = `translateX(${laserX}px)`;

                    // Animar la bajada fluida de las tarjetas anteriores
                    listaTarjetas.forEach(t => {
                        if (t.y < t.targetY) {
                            t.y += (t.targetY - t.y) * 0.2;
                        }
                    });

                    rediseñarEscenario();

                    if (p < 1) {
                        requestAnimationFrame(bucleLaser);
                    } else {
                        // Fin del grabado: la tarjeta pasa a ser fija en el rollo de papel
                        listaTarjetas.unshift(estadoGrabado);
                        estadoGrabado = null;
                        laserHead.style.transform = `translateX(0px)`;
                        if (listaTarjetas.length > 3) {
                            listaTarjetas.pop();
                        }
                        rediseñarEscenario();
                    }
                }

                bucleLaser();
            };
        }
    </script>
</body>
</html>
