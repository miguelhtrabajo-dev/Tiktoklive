<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live 3D Printer - Joyas Jack</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #0b0e14; /* Fondo oscuro ideal para OBS / TikTok Studio */
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* Pantalla de Activación por Key / Licencia */
        #auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 19, 23, 0.98);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .auth-box {
            background: #1e272e;
            padding: 30px;
            border-radius: 12px;
            border: 2px solid #485460;
            text-align: center;
            width: 350px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.7);
            color: #fff;
        }
        .auth-box h2 { margin-bottom: 15px; color: #f1c40f; }
        .auth-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #111;
            border: 1px solid #485460;
            color: #fff;
            border-radius: 6px;
            text-align: center;
            font-size: 16px;
        }
        .auth-box button {
            width: 100%;
            padding: 12px;
            background: #e74c3c;
            border: none;
            color: #fff;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .error-msg { color: #ff6b6b; font-size: 13px; margin-top: 10px; display: none; }

        /* Panel de Control flotante (Admin / Botón de Prueba para ver la máquina en acción) */
        #control-panel {
            display: none;
            position: fixed;
            top: 20px; right: 20px;
            background: rgba(30, 39, 46, 0.95);
            border: 2px solid #f1c40f;
            padding: 15px;
            border-radius: 10px;
            z-index: 2000;
            color: #fff;
            width: 280px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }
        #control-panel button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            background: #27ae60;
            border: none;
            color: #fff;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }

        /* --- MÁQUINA 3D Y RODILLO DE PAPEL CONTINUO (ESTILO FOTO) --- */
        .printer-scene {
            position: relative;
            width: 480px;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Estructura superior de la impresora 3D (El pórtico con rieles) */
        .printer-gantry {
            position: relative;
            width: 440px;
            height: 75px;
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            border-radius: 10px;
            border: 3px solid #7f8c8d;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 30px rgba(0,0,0,0.8), inset 0 3px 6px rgba(255,255,255,0.2);
        }

        /* Rieles metálicos laterales */
        .printer-gantry::before, .printer-gantry::after {
            content: '';
            position: absolute;
            top: 15px;
            width: 25px;
            height: 50px;
            background: linear-gradient(90deg, #bdc3c7, #fff, #7f8c8d);
            border-radius: 4px;
            border: 2px solid #222;
        }
        .printer-gantry::before { left: -15px; }
        .printer-gantry::after { right: -15px; }

        /* Cabezal de impresión deslizante */
        .printer-nozzle-head {
            width: 80px;
            height: 38px;
            background: linear-gradient(180deg, #e74c3c, #c0392b);
            border-radius: 6px;
            border: 2px solid #900c3f;
            position: relative;
            box-shadow: 0 0 15px #e74c3c;
            animation: moveHead 2.5s ease-in-out infinite alternate;
        }

        .printer-nozzle-head::after {
            content: '';
            position: absolute;
            bottom: -7px;
            left: 33px;
            width: 14px;
            height: 8px;
            background: #f1c40f;
            box-shadow: 0 0 10px #f1c40f;
        }

        @keyframes moveHead {
            0% { transform: translateX(-120px); }
            100% { transform: translateX(120px); }
        }

        /* Ranura de salida de papel */
        .printer-slot-exit {
            width: 380px;
            height: 12px;
            background: #000;
            border-radius: 0 0 6px 6px;
            z-index: 55;
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.9);
            border-top: 3px solid #111;
        }

        /* Rollo de papel continuo (Hoja pergamino idéntica a la imagen) */
        .paper-roll-sheet {
            position: relative;
            width: 360px;
            background: #f4edd3; /* Tono papel pergamino realista */
            border-left: 3px solid #c8b99c;
            border-right: 3px solid #c8b99c;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0 30px 0;
            z-index: 10;
            min-height: 150px;
        }

        /* Tarjeta / Recuadro impreso en la hoja */
        .printed-ticket-box {
            width: 300px;
            background: #ffffff;
            border: 2px solid #2f3640;
            border-radius: 6px;
            padding: 15px;
            margin-top: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            animation: printCardAnim 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes printCardAnim {
            0% {
                transform: translateY(-50px) scale(0.9);
                opacity: 0;
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .ticket-avatar-circle {
            width: 90px;
            height: 90px;
            border: 3px solid #2f3640;
            border-radius: 50%;
            overflow: hidden;
            background: #ddd;
            margin-bottom: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        .ticket-avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .ticket-username-text {
            font-size: 16px;
            font-weight: 700;
            color: #2f3640;
            margin-bottom: 5px;
            text-align: center;
        }

        .ticket-gift-tag {
            font-size: 13px;
            font-weight: 600;
            color: #c0392b;
            background: #fadbd8;
            padding: 3px 10px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Activación por Key / Licencia -->
    <div id="auth-overlay">
        <div class="auth-box">
            <h2>🔑 Activar Sistema</h2>
            <p style="font-size: 12px; color: #a0aec0; margin-bottom: 15px;">Ingresa tu Key vitalicia o Admin Key</p>
            <input type="text" id="license-input" placeholder="Ingresa tu Clave">
            <button onclick="verificarLicencia()">Activar</button>
            <div id="error-msg" class="error-msg">Clave incorrecta o no válida para este PC.</div>
        </div>
    </div>

    <!-- Panel de Control y Botón de Prueba -->
    <div id="control-panel">
        <h3 style="margin-top:0; color:#f1c40f; font-size:15px;">⚙️ Panel de Control</h3>
        <p style="font-size: 11px; margin-bottom:5px; word-break: break-all;">HWID: <span id="current-hwid" style="color: #f1c40f;"></span></p>
        <button onclick="probarImpresionManual()" style="background:#27ae60;">🖨️ Botón de Prueba (Simular Regalo)</button>
        <button onclick="generarKey()" style="background:#2980b9;">🔑 Crear Key para Cliente</button>
    </div>

    <!-- Estructura Visual de la Máquina 3D y Rollo de Papel -->
    <div class="printer-scene">
        <div class="printer-gantry">
            <div class="printer-nozzle-head"></div>
        </div>
        <div class="printer-slot-exit"></div>
        
        <!-- Rollo de papel continuo donde se imprimen los perfiles -->
        <div class="paper-roll-sheet" id="cards-container">
            <!-- Aquí aparecerán los perfiles impresos -->
        </div>
    </div>

    <script>
        // Gestión del HWID de la PC
        let pcHwid = localStorage.getItem('device_hwid');
        if (!pcHwid) {
            pcHwid = 'HWID-' + Math.random().toString(36).substring(2, 9).toUpperCase();
            localStorage.setItem('device_hwid', pcHwid);
        }
        document.getElementById('current-hwid').innerText = pcHwid;

        window.onload = function() {
            let saved = localStorage.getItem('app_activated_key');
            if (saved) {
                document.getElementById('auth-overlay').style.display = 'none';
                if (saved === 'Carolinaymiguel') {
                    document.getElementById('control-panel').style.display = 'block';
                }
                iniciarModoLive();
            }
        };

        function verificarLicencia() {
            let val = document.getElementById('license-input').value.trim();
            if (val === 'Carolinaymiguel') {
                localStorage.setItem('app_activated_key', 'Carolinaymiguel');
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('control-panel').style.display = 'block';
                iniciarModoLive();
                return;
            }

            let keys = JSON.parse(localStorage.getItem('jj_keys') || '{}');
            if (keys[val] === pcHwid) {
                localStorage.setItem('app_activated_key', val);
                document.getElementById('auth-overlay').style.display = 'none';
                iniciarModoLive();
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        function generarKey() {
            let targetHwid = prompt("Ingresa el HWID del PC del cliente:");
            if (!targetHwid) return;
            let newKey = 'JJ-' + Math.random().toString(36).substring(2, 8).toUpperCase();
            let keys = JSON.parse(localStorage.getItem('jj_keys') || '{}');
            keys[newKey] = targetHwid.trim();
            localStorage.setItem('jj_keys', JSON.stringify(keys));
            alert("Key generada con éxito:\n\n" + newKey);
        }

        // Función principal para imprimir el perfil en la hoja de papel continuo
        function imprimirEnPapel(username, avatarUrl, giftName) {
            const container = document.getElementById('cards-container');
            const card = document.createElement('div');
            card.className = 'printed-ticket-box';
            
            card.innerHTML = `
                <div class="ticket-avatar-circle">
                    <img src="${avatarUrl || 'https://via.placeholder.com/100'}" alt="Avatar">
                </div>
                <div class="ticket-username-text">@${username}</div>
                <div class="ticket-gift-tag">🎁 ¡Envió ${giftName}!</div>
            `;

            // Inserta el nuevo ticket arriba en el rollo de papel (simulando que sale de la ranura)
            container.insertBefore(card, container.firstChild);

            // Mantener máximo 4 tarjetas visibles en el rollo para mantener el diseño limpio
            if (container.children.length > 4) {
                container.removeChild(container.lastChild);
            }
        }

        // --- BOTÓN DE PRUEBA (Para ver la máquina funcionando sin estar en Live) ---
        function probarImpresionManual() {
            const nombresPrueba = ["ClienteVip_925", "JoyasJack_Fan", "ColeccionistaChile", "CompradorEstelar"];
            const regalosPrueba = ["Rosa x1", "León 🦁", "TikTok Universe 🌌", "Gorra x5"];
            const avataresPrueba = [
                "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150",
                "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150",
                "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150",
                "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150"
            ];

            let randomUser = nombresPrueba[Math.floor(Math.random() * nombresPrueba.length)];
            let randomGift = regalosPrueba[Math.floor(Math.random() * regalosPrueba.length)];
            let randomAvatar = avataresPrueba[Math.floor(Math.random() * avataresPrueba.length)];

            imprimirEnPapel(randomUser, randomAvatar, randomGift);
        }

        function iniciarModoLive() {
            console.log("Sistema configurado. En espera de conexión con TikTok LIVE.");
            // Aquí se conectará con el WebSocket de tu directo de TikTok cuando estés transmitiendo.
        }
    </script>
</body>
</html>
