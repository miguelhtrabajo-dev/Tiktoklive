<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live 3D Printer - Joyas Jack</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: transparent;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* Pantalla de Activación / Licencia */
        #auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 19, 23, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .auth-box {
            background: #1e272e;
            padding: 30px;
            border-radius: 12px;
            border: 2px solid #485460;
            text-align: center;
            width: 350px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.7);
            color: #fff;
        }
        .auth-box h2 { margin-bottom: 15px; color: #f1c40f; }
        .auth-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #111;
            border: 1px solid #485460;
            color: #fff;
            border-radius: 6px;
            text-align: center;
            font-size: 16px;
        }
        .auth-box button {
            width: 100%;
            padding: 12px;
            background: #e74c3c;
            border: none;
            color: #fff;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .error-msg { color: #ff6b6b; font-size: 13px; margin-top: 10px; display: none; }

        /* Panel de Administración */
        #admin-panel {
            display: none;
            position: fixed;
            top: 20px; right: 20px;
            background: rgba(30, 39, 46, 0.95);
            border: 2px solid #f1c40f;
            padding: 20px;
            border-radius: 10px;
            z-index: 2000;
            color: #fff;
            width: 320px;
        }

        /* --- ESTRUCTURA 3D REAL DE LA IMPRESORA (ESTILO VISTA SUPERIOR / TIKTOK LIVE) --- */
        .printer-3d-scene {
            position: relative;
            width: 500px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            perspective: 1000px;
        }

        /* Cuerpo principal de la máquina con efecto 3D y perspectiva */
        .printer-body-3d {
            position: relative;
            width: 460px;
            height: 110px;
            background: linear-gradient(135deg, #34495e, #1a252f);
            border-radius: 15px;
            border: 4px solid #7f8c8d;
            z-index: 40;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 5px 10px rgba(255,255,255,0.2);
            transform: rotateX(10deg);
        }

        /* Rieles metálicos laterales simulados en 3D */
        .printer-body-3d::before, .printer-body-3d::after {
            content: '';
            position: absolute;
            top: 20px;
            width: 30px;
            height: 65px;
            background: linear-gradient(90deg, #bdc3c7, #ecf0f1, #7f8c8d);
            border-radius: 6px;
            border: 2px solid #2c3e50;
        }
        .printer-body-3d::before { left: -18px; }
        .printer-body-3d::after { right: -18px; }

        /* Cabezal deslizante de la impresora */
        .print-head-slider {
            width: 100px;
            height: 45px;
            background: linear-gradient(180deg, #e74c3c, #c0392b);
            border-radius: 6px;
            border: 2px solid #78281f;
            position: relative;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
            animation: slideHead 3s ease-in-out infinite alternate;
        }

        @keyframes slideHead {
            0% { transform: translateX(-130px); }
            100% { transform: translateX(130px); }
        }

        /* Ranura de salida del papel integrada en el cuerpo 3D */
        .printer-output-slot {
            width: 380px;
            height: 14px;
            background: #0b0f12;
            border-radius: 0 0 8px 8px;
            border-top: 4px solid #000;
            z-index: 50;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.9);
            margin-top: -2px;
        }

        /* Contenedor donde se despliegan las tarjetas impresas */
        .paper-roll-stream {
            position: relative;
            width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        /* Estilo de la tarjeta impresa con aspecto de papel fotográfico */
        .ticket-item {
            width: 300px;
            background: #fffdf5;
            border: 2px solid #2c3e50;
            border-radius: 6px;
            padding: 16px;
            margin-top: -15px; /* Superposición perfecta para efecto continuo */
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            animation: printDown 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes printDown {
            0% {
                transform: translateY(-80px) scale(0.85);
                opacity: 0;
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .ticket-avatar-container {
            width: 95px;
            height: 95px;
            border: 3px solid #2c3e50;
            border-radius: 50%;
            overflow: hidden;
            background: #e2e8f0;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .ticket-avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .ticket-user-name {
            font-size: 16px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 5px;
            text-align: center;
        }

        .ticket-gift-tag {
            font-size: 13px;
            font-weight: 600;
            color: #c0392b;
            background: #fadbd8;
            padding: 3px 12px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Activación por Key / Licencia -->
    <div id="auth-overlay">
        <div class="auth-box">
            <h2>🔑 Activar Sistema</h2>
            <p style="font-size: 12px; color: #a0aec0; margin-bottom: 15px;">Ingresa tu Key de por vida o Admin Key</p>
            <input type="text" id="license-input" placeholder="Ingresa tu Clave">
            <button onclick="verificarLicencia()">Activar</button>
            <div id="error-msg" class="error-msg">Clave incorrecta o no válida para este PC.</div>
        </div>
    </div>

    <!-- Panel de Administración -->
    <div id="admin-panel">
        <h3>⚙️ Admin Panel</h3>
        <p style="font-size: 11px; word-break: break-all;">HWID: <span id="current-hwid" style="color: #f1c40f;"></span></p>
        <button onclick="generarKey()" style="background:#27ae60; border:none; color:#fff; padding:8px; width:100%; border-radius:4px; cursor:pointer; font-weight:bold;">Crear Key para Cliente</button>
    </div>

    <!-- Escenario Visual de la Máquina 3D -->
    <div class="printer-3d-scene">
        <div class="printer-body-3d">
            <div class="print-head-slider"></div>
        </div>
        <div class="printer-output-slot"></div>
        
        <div class="paper-roll-stream" id="cards-container">
            <!-- La pantalla se mantiene limpia y en espera real de tu TikTok LIVE -->
        </div>
    </div>

    <script>
        // Gestión del HWID de la PC
        let pcHwid = localStorage.getItem('device_hwid');
        if (!pcHwid) {
            pcHwid = 'HWID-' + Math.random().toString(36).substring(2, 9).toUpperCase();
            localStorage.setItem('device_hwid', pcHwid);
        }
        document.getElementById('current-hwid').innerText = pcHwid;

        window.onload = function() {
            let saved = localStorage.getItem('app_activated_key');
            if (saved) {
                document.getElementById('auth-overlay').style.display = 'none';
                if (saved === 'Carolinaymiguel') {
                    document.getElementById('admin-panel').style.display = 'block';
                }
                prepararEscuchaLive();
            }
        };

        function verificarLicencia() {
            let val = document.getElementById('license-input').value.trim();
            if (val === 'Carolinaymiguel') {
                localStorage.setItem('app_activated_key', 'Carolinaymiguel');
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                prepararEscuchaLive();
                return;
            }

            let keys = JSON.parse(localStorage.getItem('jj_keys') || '{}');
            if (keys[val] === pcHwid) {
                localStorage.setItem('app_activated_key', val);
                document.getElementById('auth-overlay').style.display = 'none';
                prepararEscuchaLive();
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        function generarKey() {
            let targetHwid = prompt("Ingresa el HWID del PC del cliente:");
            if (!targetHwid) return;
            let newKey = 'JJ-' + Math.random().toString(36).substring(2, 8).toUpperCase();
            let keys = JSON.parse(localStorage.getItem('jj_keys') || '{}');
            keys[newKey] = targetHwid.trim();
            localStorage.setItem('jj_keys', JSON.stringify(keys));
            alert("Key generada con éxito:\n\n" + newKey);
        }

        // Función real para disparar el efecto cuando recibas un regalo en tu LIVE
        function imprimirRegaloLive(username, avatarUrl, giftName) {
            const container = document.getElementById('cards-container');
            const card = document.createElement('div');
            card.className = 'ticket-item';
            
            card.innerHTML = `
                <div class="ticket-avatar-container">
                    <img src="${avatarUrl || 'https://via.placeholder.com/100'}" alt="Avatar">
                </div>
                <div class="ticket-user-name">@${username}</div>
                <div class="ticket-gift-tag">🎁 ¡Envió ${giftName}!</div>
            `;

            container.insertBefore(card, container.firstChild);

            // Mantener máximo 4 tarjetas visibles para no saturar
            if (container.children.length > 4) {
                container.removeChild(container.lastChild);
            }
        }

        function prepararEscuchaLive() {
            console.log("Sistema configurado. Cero pruebas falsas. Esperando eventos reales de TikTok LIVE.");
        }
    </script>
</body>
</html>
