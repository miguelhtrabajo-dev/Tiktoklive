<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live 3D Printer - Joyas Jack</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: transparent;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* Pantalla de Activación / Licencia */
        #auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 19, 23, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .auth-box {
            background: #1e272e;
            padding: 30px;
            border-radius: 12px;
            border: 2px solid #485460;
            text-align: center;
            width: 350px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.7);
            color: #fff;
        }
        .auth-box h2 { margin-bottom: 15px; color: #f1c40f; }
        .auth-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #111;
            border: 1px solid #485460;
            color: #fff;
            border-radius: 6px;
            text-align: center;
            font-size: 16px;
        }
        .auth-box button {
            width: 100%;
            padding: 12px;
            background: #e74c3c;
            border: none;
            color: #fff;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .error-msg { color: #ff6b6b; font-size: 13px; margin-top: 10px; display: none; }

        /* Panel Admin */
        #admin-panel {
            display: none;
            position: fixed;
            top: 20px; right: 20px;
            background: rgba(30, 39, 46, 0.95);
            border: 2px solid #f1c40f;
            padding: 20px;
            border-radius: 10px;
            z-index: 2000;
            color: #fff;
            width: 320px;
        }

        /* Estructura de la máquina 3D idéntica al estilo del video */
        .machine-container {
            position: relative;
            width: 460px;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .printer-frame {
            width: 420px;
            height: 50px;
            background: linear-gradient(135deg, #2f3640, #192a56);
            border-radius: 8px;
            border: 3px solid #718093;
            position: relative;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .printer-slit {
            width: 360px;
            height: 8px;
            background: #000;
            border-radius: 4px;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.3);
        }

        /* Área de salida del papel / tarjetas */
        .paper-stream {
            position: relative;
            width: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        /* Tarjeta impresa limpia y profesional */
        .printed-ticket {
            width: 260px;
            background: #fffef9;
            border: 2px solid #2f3640;
            border-radius: 4px;
            padding: 12px;
            margin-top: -12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            animation: printMotion 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes printMotion {
            0% { transform: translateY(-50px) scale(0.9); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .ticket-avatar-box {
            width: 80px;
            height: 80px;
            border: 2px solid #2f3640;
            border-radius: 50%;
            overflow: hidden;
            background: #ddd;
            margin-bottom: 8px;
        }

        .ticket-avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .ticket-user {
            font-size: 15px;
            font-weight: 700;
            color: #2f3640;
            margin-bottom: 3px;
        }

        .ticket-gift-info {
            font-size: 12px;
            font-weight: 600;
            color: #c0392b;
            background: #fadbd8;
            padding: 2px 8px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Login -->
    <div id="auth-overlay">
        <div class="auth-box">
            <h2>🔑 Activar Sistema</h2>
            <input type="text" id="license-input" placeholder="Ingresa tu Key o Admin Key">
            <button onclick="verificarLicencia()">Entrar</button>
            <div id="error-msg" class="error-msg">Clave incorrecta.</div>
        </div>
    </div>

    <!-- Panel de Administración -->
    <div id="admin-panel">
        <h3>⚙️ Admin Panel</h3>
        <p style="font-size: 11px; word-break: break-all;">HWID: <span id="current-hwid" style="color: #f1c40f;"></span></p>
        <button onclick="generarKey()" style="background:#27ae60; border:none; color:#fff; padding:8px; width:100%; border-radius:4px; cursor:pointer; font-weight:bold;">Crear Key para Cliente</button>
    </div>

    <!-- Interfaz de la Máquina 3D -->
    <div class="machine-container">
        <div class="printer-frame">
            <div class="printer-slit"></div>
        </div>
        
        <div class="paper-stream" id="cards-container">
            <!-- Las tarjetas aparecerán únicamente cuando recibas regalos reales en tu LIVE -->
        </div>
    </div>

    <script>
        let pcHwid = localStorage.getItem('device_hwid');
        if (!pcHwid) {
            pcHwid = 'HWID-' + Math.random().toString(36).substring(2, 9).toUpperCase();
            localStorage.setItem('device_hwid', pcHwid);
        }
        document.getElementById('current-hwid').innerText = pcHwid;

        window.onload = function() {
            let saved = localStorage.getItem('app_activated_key');
            if (saved) {
                document.getElementById('auth-overlay').style.display = 'none';
                if (saved === 'Carolinaymiguel') {
                    document.getElementById('admin-panel').style.display = 'block';
                }
                inicializarConexionLive();
            }
        };

        function verificarLicencia() {
            let val = document.getElementById('license-input').value.trim();
            if (val === 'Carolinaymiguel') {
                localStorage.setItem('app_activated_key', 'Carolinaymiguel');
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                inicializarConexionLive();
                return;
            }

            let keys = JSON.parse(localStorage.getItem('jj_keys') || '{}');
            if (keys[val] === pcHwid) {
                localStorage.setItem('app_activated_key', val);
                document.getElementById('auth-overlay').style.display = 'none';
                inicializarConexionLive();
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        function generarKey() {
            let targetHwid = prompt("Ingresa el HWID del PC del cliente:");
            if (!targetHwid) return;
            let newKey = 'JJ-' + Math.random().toString(36).substring(2, 8).toUpperCase();
            let keys = JSON.parse(localStorage.getItem('jj_keys') || '{}');
            keys[newKey] = targetHwid.trim();
            localStorage.setItem('jj_keys', JSON.stringify(keys));
            alert("Key generada con éxito:\n\n" + newKey);
        }

        // Función que dibuja la tarjeta en la máquina 3D cuando llega un regalo real
        function mostrarRegaloEnImpresora(username, avatarUrl, giftName) {
            const container = document.getElementById('cards-container');
            const card = document.createElement('div');
            card.className = 'printed-ticket';
            
            card.innerHTML = `
                <div class="ticket-avatar-box">
                    <img src="${avatarUrl || 'https://via.placeholder.com/100'}" alt="Avatar">
                </div>
                <div class="ticket-user">@${username}</div>
                <div class="ticket-gift-info">🎁 ${giftName}</div>
            `;

            container.insertBefore(card, container.firstChild);

            // Mantener un máximo de 4 tarjetas en pantalla
            if (container.children.length > 4) {
                container.removeChild(container.lastChild);
            }
        }

        function inicializarConexionLive() {
            // El sistema queda en modo escucha real para TikTok Live.
            // (Aquí puedes conectar tu puente de WebSocket con TikTok Live Connector cuando realices tu transmisión).
            console.log("Sistema listo y en espera de regalos reales de TikTok LIVE.");
        }
    </script>
</body>
</html>
