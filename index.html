<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live 3D Printer - Joyas Jack</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #0f1317; /* Fondo oscuro para apreciar el efecto 3D en OBS/TikTok Studio */
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* Pantalla de Activación por Key / Licencia */
        #auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 19, 23, 0.98);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .auth-box {
            background: #1e272e;
            padding: 30px;
            border-radius: 12px;
            border: 2px solid #485460;
            text-align: center;
            width: 350px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.7);
            color: #fff;
        }
        .auth-box h2 { margin-bottom: 15px; color: #f1c40f; }
        .auth-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #111;
            border: 1px solid #485460;
            color: #fff;
            border-radius: 6px;
            text-align: center;
            font-size: 16px;
        }
        .auth-box button {
            width: 100%;
            padding: 12px;
            background: #e74c3c;
            border: none;
            color: #fff;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .error-msg { color: #ff6b6b; font-size: 13px; margin-top: 10px; display: none; }

        /* Panel de Administración */
        #admin-panel {
            display: none;
            position: fixed;
            top: 20px; right: 20px;
            background: rgba(30, 39, 46, 0.95);
            border: 2px solid #f1c40f;
            padding: 20px;
            border-radius: 10px;
            z-index: 2000;
            color: #fff;
            width: 320px;
        }

        /* --- MÁQUINA 3D Y RODILLO DE PAPEL CONTINUO --- */
        .live-printer-container {
            position: relative;
            width: 420px;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Estructura metálica superior de la impresora 3D */
        .machine-bridge {
            position: relative;
            width: 400px;
            height: 70px;
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            border-radius: 10px;
            border: 3px solid #7f8c8d;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }

        /* Rieles metálicos laterales */
        .machine-bridge::before, .machine-bridge::after {
            content: '';
            position: absolute;
            top: 15px;
            width: 20px;
            height: 45px;
            background: linear-gradient(90deg, #bdc3c7, #fff, #7f8c8d);
            border-radius: 4px;
            border: 1px solid #222;
        }
        .machine-bridge::before { left: -12px; }
        .machine-bridge::after { right: -12px; }

        /* Cabezal láser que se mueve dibujando */
        .laser-print-head {
            width: 70px;
            height: 35px;
            background: linear-gradient(180deg, #e74c3c, #c0392b);
            border-radius: 4px;
            border: 2px solid #900c3f;
            position: relative;
            box-shadow: 0 0 15px #e74c3c;
            animation: moveLaser 2.5s ease-in-out infinite alternate;
        }

        .laser-print-head::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 28px;
            width: 14px;
            height: 10px;
            background: #f1c40f;
            box-shadow: 0 0 12px #f1c40f;
        }

        @keyframes moveLaser {
            0% { transform: translateX(-110px); }
            100% { transform: translateX(110px); }
        }

        /* Ranura de salida */
        .paper-slot {
            width: 340px;
            height: 10px;
            background: #000;
            border-radius: 0 0 5px 5px;
            z-index: 55;
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.9);
        }

        /* Rollo de papel continuo en perspectiva vertical */
        .paper-roll-sheet {
            position: relative;
            width: 320px;
            background: #fdfbf7;
            border-left: 2px solid #d1ccc0;
            border-right: 2px solid #d1ccc0;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 20px;
            z-index: 10;
        }

        /* Tarjeta dibujada en el papel */
        .drawn-profile-card {
            width: 260px;
            background: #ffffff;
            border: 2px solid #2f3640;
            border-radius: 6px;
            padding: 14px;
            margin-top: 20px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            animation: drawCardDown 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes drawCardDown {
            0% {
                transform: translateY(-50px) scale(0.9);
                opacity: 0;
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .profile-avatar-frame {
            width: 85px;
            height: 85px;
            border: 3px solid #2f3640;
            border-radius: 50%;
            overflow: hidden;
            background: #e2e8f0;
            margin-bottom: 8px;
        }

        .profile-avatar-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-username {
            font-size: 15px;
            font-weight: 700;
            color: #2f3640;
            margin-bottom: 4px;
            text-align: center;
        }

        .profile-gift-badge {
            font-size: 12px;
            font-weight: 600;
            color: #c0392b;
            background: #fadbd8;
            padding: 2px 10px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Activación por Key / Licencia -->
    <div id="auth-overlay">
        <div class="auth-box">
            <h2>🔑 Activar Sistema</h2>
            <p style="font-size: 12px; color: #a0aec0; margin-bottom: 15px;">Ingresa tu Key vitalicia o Admin Key</p>
            <input type="text" id="license-input" placeholder="Ingresa tu Clave">
            <button onclick="verificarLicencia()">Activar</button>
            <div id="error-msg" class="error-msg">Clave incorrecta o no válida para este PC.</div>
        </div>
    </div>

    <!-- Panel de Administración -->
    <div id="admin-panel">
        <h3>⚙️ Admin Panel</h3>
        <p style="font-size: 11px; word-break: break-all;">HWID: <span id="current-hwid" style="color: #f1c40f;"></span></p>
        <button onclick="generarKey()" style="background:#27ae60; border:none; color:#fff; padding:8px; width:100%; border-radius:4px; cursor:pointer; font-weight:bold;">Crear Key para Cliente</button>
    </div>

    <!-- Estructura de la Máquina 3D Dibujando sobre el Papel -->
    <div class="live-printer-container">
        <div class="machine-bridge">
            <div class="laser-print-head"></div>
        </div>
        <div class="paper-slot"></div>
        
        <!-- Rollo de papel continuo donde se imprimen los perfiles -->
        <div class="paper-roll-sheet" id="cards-container">
            <!-- Las tarjetas aparecerán aquí ordenadamente cuando lleguen regalos reales -->
        </div>
    </div>

    <script>
        // Gestión del HWID de la PC
        let pcHwid = localStorage.getItem('device_hwid');
        if (!pcHwid) {
            pcHwid = 'HWID-' + Math.random().toString(36).substring(2, 9).toUpperCase();
            localStorage.setItem('device_hwid', pcHwid);
        }
        document.getElementById('current-hwid').innerText = pcHwid;

        window.onload = function() {
            let saved = localStorage.getItem('app_activated_key');
            if (saved) {
                document.getElementById('auth-overlay').style.display = 'none';
                if (saved === 'Carolinaymiguel') {
                    document.getElementById('admin-panel').style.display = 'block';
                }
                prepararEscuchaLive();
            }
        };

        function verificarLicencia() {
            let val = document.getElementById('license-input').value.trim();
            if (val === 'Carolinaymiguel') {
                localStorage.setItem('app_activated_key', 'Carolinaymiguel');
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                prepararEscuchaLive();
                return;
            }

            let keys = JSON.parse(localStorage.getItem('jj_keys') || '{}');
            if (keys[val] === pcHwid) {
                localStorage.setItem('app_activated_key', val);
                document.getElementById('auth-overlay').style.display = 'none';
                prepararEscuchaLive();
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        function generarKey() {
            let targetHwid = prompt("Ingresa el HWID del PC del cliente:");
            if (!targetHwid) return;
            let newKey = 'JJ-' + Math.random().toString(36).substring(2, 8).toUpperCase();
            let keys = JSON.parse(localStorage.getItem('jj_keys') || '{}');
            keys[newKey] = targetHwid.trim();
            localStorage.setItem('jj_keys', JSON.stringify(keys));
            alert("Key generada con éxito:\n\n" + newKey);
        }

        // Función que dibuja el perfil en el papel continuo al recibir un regalo real
        function dibujarPerfilEnPapel(username, avatarUrl, giftName) {
            const container = document.getElementById('cards-container');
            const card = document.createElement('div');
            card.className = 'drawn-profile-card';
            
            card.innerHTML = `
                <div class="profile-avatar-frame">
                    <img src="${avatarUrl || 'https://via.placeholder.com/100'}" alt="Avatar">
                </div>
                <div class="profile-username">@${username}</div>
                <div class="profile-gift-badge">🎁 ¡Envió ${giftName}!</div>
            `;

            // Inserta el nuevo dibujo arriba en el rollo de papel
            container.insertBefore(card, container.firstChild);

            // Mantener máximo 4 perfiles en el papel para que no crezca infinitamente
            if (container.children.length > 4) {
                container.removeChild(container.lastChild);
            }
        }

        function prepararEscuchaLive() {
            console.log("Sistema listo en el papel continuo. Esperando regalos reales de TikTok LIVE.");
        }
    </script>
</body>
</html>
