<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live 3D Printer - Joyas Jack</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: transparent;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* Pantalla de Activación / Login Admin */
        #auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 19, 23, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .auth-box {
            background: #1e272e;
            padding: 30px;
            border-radius: 12px;
            border: 2px solid #485460;
            text-align: center;
            width: 350px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.7);
            color: #fff;
        }
        .auth-box h2 { margin-bottom: 15px; color: #f1c40f; }
        .auth-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #111;
            border: 1px solid #485460;
            color: #fff;
            border-radius: 6px;
            text-align: center;
            font-size: 16px;
        }
        .auth-box button {
            width: 100%;
            padding: 12px;
            background: #e74c3c;
            border: none;
            color: #fff;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .error-msg { color: #ff6b6b; font-size: 13px; margin-top: 10px; display: none; }

        /* Panel de Administración */
        #admin-panel {
            display: none;
            position: fixed;
            top: 20px; right: 20px;
            background: rgba(30, 39, 46, 0.95);
            border: 2px solid #f1c40f;
            padding: 20px;
            border-radius: 10px;
            z-index: 2000;
            color: #fff;
            width: 320px;
        }

        /* Contenedor principal de la máquina 3D estilo del video */
        .machine-wrapper {
            position: relative;
            width: 480px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Estructura superior de la impresora 3D */
        .printer-top-bar {
            width: 440px;
            height: 60px;
            background: linear-gradient(135deg, #34495e, #2c3e50);
            border-radius: 10px;
            border: 3px solid #7f8c8d;
            position: relative;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .printer-slot-line {
            width: 380px;
            height: 10px;
            background: #000;
            border-radius: 5px;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.2);
        }

        /* Área donde descienden las tarjetas impresas */
        .output-stream {
            position: relative;
            width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        /* Tarjeta individual impresa (Foto + Nombre + Regalo) */
        .ticket-card {
            width: 270px;
            background: #fdfbf7;
            border: 2px solid #2c3e50;
            border-radius: 6px;
            padding: 12px;
            margin-top: -15px; /* Superposición para el efecto continuo */
            box-shadow: 0 8px 16px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            animation: slideDown 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes slideDown {
            0% {
                transform: translateY(-60px) scale(0.9);
                opacity: 0;
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .ticket-avatar {
            width: 85px;
            height: 85px;
            border: 2px solid #2c3e50;
            border-radius: 50%;
            overflow: hidden;
            background: #eee;
            margin-bottom: 8px;
        }

        .ticket-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .ticket-name {
            font-size: 15px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 4px;
            text-align: center;
        }

        .ticket-gift {
            font-size: 12px;
            font-weight: 600;
            color: #e74c3c;
            background: #fadbd8;
            padding: 2px 8px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Activación -->
    <div id="auth-overlay">
        <div class="auth-box">
            <h2>🔑 Activar Sistema</h2>
            <input type="text" id="license-input" placeholder="Ingresa tu Key o Admin Key">
            <button onclick="verificarLicencia()">Entrar</button>
            <div id="error-msg" class="error-msg">Clave incorrecta.</div>
        </div>
    </div>

    <!-- Panel Admin -->
    <div id="admin-panel">
        <h3>⚙️ Admin Panel</h3>
        <p style="font-size: 11px; word-break: break-all;">HWID: <span id="current-hwid" style="color: #f1c40f;"></span></p>
        <button onclick="generarKey()" style="background:#27ae60; border:none; color:#fff; padding:8px; width:100%; border-radius:4px; cursor:pointer; font-weight:bold;">Crear Key para Cliente</button>
    </div>

    <!-- Interfaz de la Máquina 3D -->
    <div class="machine-wrapper">
        <div class="printer-top-bar">
            <div class="printer-slot-line"></div>
        </div>
        
        <div class="output-stream" id="cards-container">
            <!-- Las tarjetas impresas se generan aquí automáticamente -->
        </div>
    </div>

    <script>
        // HWID del dispositivo
        let pcHwid = localStorage.getItem('device_hwid');
        if (!pcHwid) {
            pcHwid = 'HWID-' + Math.random().toString(36).substring(2, 9).toUpperCase();
            localStorage.setItem('device_hwid', pcHwid);
        }
        document.getElementById('current-hwid').innerText = pcHwid;

        window.onload = function() {
            let saved = localStorage.getItem('app_activated_key');
            if (saved) {
                document.getElementById('auth-overlay').style.display = 'none';
                if (saved === 'Carolinaymiguel') {
                    document.getElementById('admin-panel').style.display = 'block';
                }
                iniciarLiveSimulator();
            }
        };

        function verificarLicencia() {
            let val = document.getElementById('license-input').value.trim();
            if (val === 'Carolinaymiguel') {
                localStorage.setItem('app_activated_key', 'Carolinaymiguel');
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                iniciarLiveSimulator();
                return;
            }

            let keys = JSON.parse(localStorage.getItem('jj_keys') || '{}');
            if (keys[val] === pcHwid) {
                localStorage.setItem('app_activated_key', val);
                document.getElementById('auth-overlay').style.display = 'none';
                iniciarLiveSimulator();
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        function generarKey() {
            let targetHwid = prompt("Ingresa el HWID del PC del cliente:");
            if (!targetHwid) return;
            let newKey = 'JJ-' + Math.random().toString(36).substring(2, 8).toUpperCase();
            let keys = JSON.parse(localStorage.getItem('jj_keys') || '{}');
            keys[newKey] = targetHwid.trim();
            localStorage.setItem('jj_keys', JSON.stringify(keys));
            alert("Key generada con éxito:\n\n" + newKey);
        }

        // Función que imprime la tarjeta en pantalla de forma automática
        function imprimirTarjeta(username, avatarUrl, giftName) {
            const container = document.getElementById('cards-container');
            const card = document.createElement('div');
            card.className = 'ticket-card';
            
            card.innerHTML = `
                <div class="ticket-avatar">
                    <img src="${avatarUrl || 'https://via.placeholder.com/100'}" alt="Avatar">
                </div>
                <div class="ticket-name">@${username}</div>
                <div class="ticket-gift">🎁 ${giftName}</div>
            `;

            container.insertBefore(card, container.firstChild);

            // Mantener máximo 4 tarjetas visibles para un flujo ordenado
            if (container.children.length > 4) {
                container.removeChild(container.lastChild);
            }
        }

        // Simulador automático de regalos para TikTok Live
        function iniciarLiveSimulator() {
            setInterval(() => {
                const users = ["ClienteVip", "JoyasJackFan", "Coleccionista_925", "CompradorEstelar"];
                const gifts = ["Rosa x1", "León", "TikTok Universe", "Gorra x5"];
                let u = users[Math.floor(Math.random() * users.length)];
                let g = gifts[Math.floor(Math.random() * gifts.length)];
                imprimirTarjeta(u, "https://via.placeholder.com/100", g);
            }, 5000);
        }
    </script>
</body>
</html>
